version: "3.7"

services:
  app_proxy:
    environment:
      # <app-id>_<docker-service-name>_1
      APP_HOST: sparkles-localai_server_1
      APP_PORT: 8080

  server:
    # v0.2 (2026-11-08): the official CUDA 13 flavor image. v0.1 pointed
    # at a custom GHCR image that does not exist (the repo's image-build
    # workflow could not be pushed), so the install failed at pull. The
    # official gpu-nvidia-cuda-13 image ships its backends preinstalled;
    # benchmark before swapping endpoints (see releaseNotes) — if its
    # bundled backend hits the glibc loader issue from 2026-11-06, the
    # custom build in docker/localai is the fallback once CI is enabled.
    image: localai/localai:v4.12.1-gpu-nvidia-cuda-13
    restart: on-failure
    # Startup health gate: fail loud, never serve on CPU silently.
    entrypoint:
      - /bin/sh
      - -c
      - |
        if ! nvidia-smi >/dev/null 2>&1; then
          echo "FATAL: no NVIDIA GPU visible in container — refusing to start (CPU fallback is disabled by design)"; exit 1
        fi
        if ! find /usr/local/share /backends -maxdepth 4 -iname '*cuda*llama*' 2>/dev/null | grep -q .; then
          echo "WARNING: no CUDA llama backend found in expected locations — check the log after start; if models run on CPU, do not swap endpoints"
        fi
        exec /entrypoint.sh "$@"
      - --
    command: ["--address=:8080", "--models-path=/models", "--localai-config-dir=/configuration"]
    environment:
      TZ: America/New_York
      LOCALAI_FORCE_META_BACKEND_CAPABILITY: "nvidia"
      THREADS: "16"
      CONTEXT_SIZE: "8192"
    volumes:
      - ${APP_DATA_DIR}/data/models:/models
      - ${APP_DATA_DIR}/data/configuration:/configuration
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      default:
        ipv4_address: $APP_LOCALAI_IP
