manifestVersion: 1
id: sparkles-localai
name: LocalAI (5090 build)
tagline: LocalAI compiled for this machine — CUDA 13, RTX 5090 (sm_120)
icon: https://raw.githubusercontent.com/justintheconquere/umbrel-community-app-store/master/icons/sparkles-localai.svg
category: ai
version: "4.12.1"
port: 8081
description: >-
  LocalAI v4.12.1, official CUDA 13 flavor image
  (localai/localai:v4.12.1-gpu-nvidia-cuda-13, backends preinstalled).
  The server REFUSES to start if the GPU is missing — it will never
  silently fall back to CPU. (v0.1 of this package pointed at a custom
  GHCR image that could not be built because the repo's workflow files
  could not be pushed; the custom build still lives in docker/localai
  as a fallback if the bundled backend misbehaves.)


  Access is Umbrel-auth only (LAN / Tailscale). Point Goose, Open WebUI
  and other apps at this app's API on port 8080 inside the Umbrel network
  (static IP in exports.sh).

developer: Justin Bryan (packaging) / LocalAI upstream
website: https://localai.io
submitter: Justin Bryan
repo: https://github.com/justintheconquere/umbrel-community-app-store
support: https://github.com/justintheconquere/umbrel-community-app-store/issues
gallery: []
releaseNotes: >-
  v4.12.1, first package. After installing, benchmark before switching
  anything over: the hand-fixed install hit ~140 tok/s (qwen3.8, 100%
  VRAM) and ~1s on the long-prompt test vs ~38s on CPU. If this build
  does not match that, do not swap endpoints. Models live in the app data
  dir and are NOT backed up (re-downloadable).
dependencies: []
path: ""
defaultUsername: ""
defaultPassword: ""
