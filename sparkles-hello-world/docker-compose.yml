version: "3.7"

services:

  app_proxy:
    environment:
      # The format here is: <app-id>_<docker-service-name>_1
      APP_HOST: sparkles-hello-world_server_1
      APP_PORT: 3000
    
  server:
    # PIN EXCEPTION: the store template's own reference app; upstream
    # publishes this demo image as :latest only. Kept as a reference.
    image: getumbrel/community-app-store-hello-world:latest
    user: "1000:1000"
    init: true
