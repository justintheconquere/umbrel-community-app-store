version: "3.7"

# Bitcart — XMR ONLY, frozen as a static Umbrel compose.
# Bitcart's own setup.sh / configurator is intentionally NOT used: it writes
# its own compose + host files, which fights Umbrel's app model. This file
# is the frozen equivalent for an XMR-only, one-domain-mode install.
#
# Layout (Bitcart one-domain mode): the `web` Caddy proxy is the only
# published port and routes / -> store, /admin -> admin, /api -> api,
# matching what BITCART_HOST one-domain mode expects.
# No app_proxy: Bitcart has its own auth and public checkout must not sit
# behind the Umbrel login.
#
# The XMR daemon talks to Justin's existing node — the official Umbrel
# Monero app (declared as a dependency, so APP_MONERO_NODE_IP /
# APP_MONERO_RPC_PORT / APP_MONERO_RPC_USER / APP_MONERO_RPC_PASS are
# exported). Monero RPC stays on the internal Umbrel network only.

services:

  web:
    # VERIFY: exact Caddy 2.x alpine tag to pin on next bump.
    image: caddy:2.8.4-alpine
    restart: on-failure
    depends_on:
      - api
      - admin
      - store
    # The app's single public port (host 3001).
    ports:
      - "3001:80"
    # Generates the Caddyfile at start (kept in the data dir so it can be
    # inspected/edited), then runs Caddy in the foreground.
    command:
      - sh
      - -c
      - |
        mkdir -p /data
        cat > /data/Caddyfile <<'EOF'
        :80 {
          handle /api/* {
            reverse_proxy api:8000
          }
          handle /admin* {
            reverse_proxy admin:80
          }
          handle {
            reverse_proxy store:80
          }
        }
        EOF
        exec caddy run --config /data/Caddyfile --adapter caddyfile
    volumes:
      - ${APP_DATA_DIR}/data/caddy:/data
    networks:
      default:
        ipv4_address: $APP_BITCART_IP

  api:
    image: bitcart/bitcart:0.10.2.0
    restart: on-failure
    depends_on:
      - db
      - redis
      - daemon-xmr
    # VERIFY: 0.10.x launches components via `just` tasks (release notes:
    # "just daemon btc" replaced "python3 daemons/btc.py"). Confirm the api
    # task name in the image's Justfile; pre-0.10 fallback is the image's
    # default CMD / main.py entrypoint.
    command: ["just", "api"]
    environment:
      # Placeholder test domain for one-domain mode. The cloudflared route
      # for bitcart.voodoobazaar.com -> localhost:3001 is only added when
      # Justin is actively testing.
      BITCART_HOST: https://bitcart.voodoobazaar.com
      # XMR only.
      BITCART_CRYPTOS: xmr
      # VERIFY: newer Bitcart settings read ENABLED_CRYPTOS instead of
      # BITCART_CRYPTOS (api/settings.py). Both are set; remove the dead one
      # once confirmed against 0.10.2.0.
      ENABLED_CRYPTOS: xmr
      # API is served under /api in one-domain mode (matches the web proxy).
      # VERIFY: env name for the root path setting (ROOT_PATH in settings).
      ROOT_PATH: /api
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: bitcart
      DB_PASSWORD: ${APP_BITCART_DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # How the API reaches the XMR daemon service (Bitcart daemons expose
      # JSON-RPC with per-coin {COIN}_HOST/{COIN}_PORT/{COIN}_LOGIN/
      # {COIN}_PASSWORD settings; defaults are login "electrum" — this
      # package sets its own credentials, shared with the daemon service).
      XMR_HOST: daemon-xmr
      XMR_PORT: "${APP_BITCART_XMR_DAEMON_PORT}"
      XMR_LOGIN: bitcart
      XMR_PASSWORD: ${APP_BITCART_DAEMON_RPC_PASSWORD}
    volumes:
      - ${APP_DATA_DIR}/data/api:/app/data
    networks:
      default:
        ipv4_address: $APP_BITCART_API_IP

  worker:
    image: bitcart/bitcart:0.10.2.0
    restart: on-failure
    depends_on:
      - api
    # VERIFY: `just` task name for the worker, as with the api service.
    command: ["just", "worker"]
    environment:
      BITCART_HOST: https://bitcart.voodoobazaar.com
      BITCART_CRYPTOS: xmr
      ENABLED_CRYPTOS: xmr
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: bitcart
      DB_PASSWORD: ${APP_BITCART_DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      XMR_HOST: daemon-xmr
      XMR_PORT: "${APP_BITCART_XMR_DAEMON_PORT}"
      XMR_LOGIN: bitcart
      XMR_PASSWORD: ${APP_BITCART_DAEMON_RPC_PASSWORD}
    volumes:
      - ${APP_DATA_DIR}/data/api:/app/data
    networks:
      default:
        ipv4_address: $APP_BITCART_WORKER_IP

  daemon-xmr:
    # There is no separate XMR daemon image: in Bitcart 0.10.x every coin
    # daemon runs from the same bitcart/bitcart image (daemons live in the
    # core repo, launched per-coin). This service runs only the XMR daemon,
    # which speaks Monero RPC to Justin's existing monerod.
    image: bitcart/bitcart:0.10.2.0
    restart: unless-stopped
    # VERIFY: `just daemon xmr` task form (0.10.x); older form was
    # "python3 daemons/xmr.py".
    command: ["just", "daemon", "xmr"]
    environment:
      XMR_NETWORK: mainnet
      # Daemon bind + its own JSON-RPC auth (the api/worker services use
      # these same values to connect).
      XMR_HOST: 0.0.0.0
      XMR_PORT: "${APP_BITCART_XMR_DAEMON_PORT}"
      XMR_LOGIN: bitcart
      XMR_PASSWORD: ${APP_BITCART_DAEMON_RPC_PASSWORD}
      # The upstream Monero node: {COIN}_SERVER is Bitcart's documented
      # per-daemon node URL setting. Credentials for the node's forced RPC
      # login are embedded in the URL.
      # VERIFY: that daemons/xmr.py accepts user:password@ in XMR_SERVER
      # (monero-python RPC client). If it needs separate fields instead,
      # this is the line to change — do NOT fall back to a public node.
      XMR_SERVER: http://${APP_MONERO_RPC_USER}:${APP_MONERO_RPC_PASS}@${APP_MONERO_NODE_IP}:${APP_MONERO_RPC_PORT}
    networks:
      default:
        ipv4_address: $APP_BITCART_DAEMON_XMR_IP

  admin:
    # VERIFY: admin image name/tag — bitcart/bitcart-admin is the published
    # admin panel image; 0.8.0.0 is the latest admin release found. Its
    # internal port is assumed 80 (static SPA image).
    image: bitcart/bitcart-admin:0.8.0.0
    restart: on-failure
    depends_on:
      - api
    networks:
      default:
        ipv4_address: $APP_BITCART_ADMIN_IP

  store:
    # VERIFY: store image name/tag and internal port — bitcart/bitcart-store
    # is the published storefront image; no independent store version was
    # found, 0.8.0.0 mirrors the admin line. Confirm on Docker Hub.
    image: bitcart/bitcart-store:0.8.0.0
    restart: on-failure
    depends_on:
      - api
    networks:
      default:
        ipv4_address: $APP_BITCART_STORE_IP

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bitcart
      POSTGRES_PASSWORD: ${APP_BITCART_DB_PASSWORD}
      POSTGRES_DB: bitcart
    volumes:
      - ${APP_DATA_DIR}/data/db:/var/lib/postgresql/data
    networks:
      default:
        ipv4_address: $APP_BITCART_DB_IP

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    volumes:
      - ${APP_DATA_DIR}/data/redis:/data
    networks:
      default:
        ipv4_address: $APP_BITCART_REDIS_IP
