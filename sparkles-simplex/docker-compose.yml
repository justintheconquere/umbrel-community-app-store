version: "3.7"

services:
  app_proxy:
    environment:
      # Only the status/help page goes through Umbrel auth. The SMP and
      # XFTP servers publish their own ports directly, below.
      APP_HOST: sparkles-simplex_web_1
      APP_PORT: 80

  smp:
    # VERIFY: pin the current v6.x tag from Docker Hub (simplexchat/smp-server)
    # before installing, and verify the -init flag syntax in the v6 docs.
    image: simplexchat/smp-server:v6.4.1
    restart: on-failure
    environment:
      # PLACEHOLDER public address baked into the server certificate on
      # first init - set this to your real domain (or leave the onion-only
      # setup) BEFORE first start; changing it later changes the address
      # every client must use.
      ADDR: simplex.example.com
    command:
      - sh
      - -c
      - |
        if [ ! -f /etc/opt/simplex/smp-server.ini ]; then
          smp-server -init -ip "$$ADDR";
          echo "First start: set the server password in smp-server.ini";
          echo "(key: password, [AUTH] section). A generated password is";
          echo "available as APP_SIMPLEX_SMP_PASSWORD in the app exports.";
        fi
        exec smp-server
    ports:
      - "5223:5223"
    volumes:
      - ${APP_DATA_DIR}/data/smp/config:/etc/opt/simplex
      - ${APP_DATA_DIR}/data/smp/logs:/var/opt/simplex
    networks:
      default:
        ipv4_address: $APP_SIMPLEX_SMP_IP

  xftp:
    # VERIFY: same v6.x pin as smp-server (simplexchat/xftp-server).
    image: simplexchat/xftp-server:v6.4.1
    restart: on-failure
    environment:
      # Quota for stored file chunks. VERIFY: in v6 the quota is set in
      # xftp-server.ini after first init; this env is a documented hint.
      XFTP_QUOTA: "20gb"
      ADDR: simplex.example.com
    command:
      - sh
      - -c
      - |
        if [ ! -f /etc/opt/simplex-xftp/xftp-server.ini ]; then
          xftp-server -init -ip "$$ADDR";
        fi
        exec xftp-server
    ports:
      - "443:443"
    volumes:
      - ${APP_DATA_DIR}/data/xftp/config:/etc/opt/simplex-xftp
      - ${APP_DATA_DIR}/data/xftp/files:/srv/xftp
      - ${APP_DATA_DIR}/data/xftp/logs:/var/opt/simplex-xftp
    networks:
      default:
        ipv4_address: $APP_SIMPLEX_XFTP_IP

  tor:
    # Same Tor image the official Umbrel Monero app uses.
    image: ghcr.io/getumbrel/tor:0.4.9.11
    user: "1000:1000"
    restart: on-failure
    environment:
      HOME: "/tmp"
    command:
      - sh
      - -c
      - |
        mkdir -p /data/hs-smp
        printf 'SocksPort 0\nHiddenServiceDir /data/hs-smp\nHiddenServicePort 5223 %s:5223\n' "$$APP_SIMPLEX_SMP_IP" > /tmp/torrc
        exec tor -f /tmp/torrc
    volumes:
      # The onion private key lives here - it IS the .onion address.
      # Back this up or the address is lost.
      - ${APP_DATA_DIR}/data/tor:/data
    networks:
      default:
        ipv4_address: $APP_SIMPLEX_TOR_IP

  web:
    image: nginx:1.27-alpine
    restart: on-failure
    command:
      - sh
      - -c
      - |
        cat > /usr/share/nginx/html/index.html <<'HTML'
        <!doctype html>
        <html><head><title>SimpleX Server</title></head>
        <body style="font-family:sans-serif;max-width:44em;margin:2em auto;padding:0 1em">
        <h1>SimpleX Server (SMP + XFTP)</h1>
        <p>Your private SimpleX relay is running. The servers do not have a web
        UI - this page only explains how to use them.</p>
        <h2>Add the servers in SimpleX Chat</h2>
        <p>After the first start, open the app data directory and read the
        server addresses (they look like smp://fingerprint@host and
        xftp://fingerprint@host) from smp-server.ini and xftp-server.ini -
        the fingerprint is printed in the first-start logs too. In the
        SimpleX Chat app: Settings, Network &amp; servers, add both
        addresses (clearnet and/or the .onion from data/tor/hs-smp/hostname).</p>
        <h2>Identity = data</h2>
        <p>The certificates and keys in this app's data directory are the
        servers' identity and address. Back them up - lose them and the
        address changes for every client.</p>
        <h2>Private relay</h2>
        <p>The SMP server is password-protected (set in smp-server.ini).
        Only clients that know the password can use it.</p>
        </body></html>
        HTML
        exec nginx -g 'daemon off;'
    networks:
      default:
        ipv4_address: $APP_SIMPLEX_WEB_IP
